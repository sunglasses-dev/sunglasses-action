name: 'Sunglasses — Agent File Scan'
description: 'Scan agent-readable files (READMEs, docs, prompts, MCP configs) for prompt injection and tool poisoning before your AI agent reads them.'
author: 'Sunglasses'
branding:
  icon: 'eye'
  color: 'green'

inputs:
  paths:
    description: 'Space-separated files, directories or globs to scan. Directories are walked recursively. Leave empty for the sensible default set (READMEs, AGENTS/CLAUDE.md, **/*.md, docs/**, prompts/**, .cursor/**, .windsurf/**, .claude/**, MCP configs).'
    required: false
    default: ''
  fail-on-threat:
    description: 'Fail the check (non-zero exit) when a threat is found. Set to "false" to report only.'
    required: false
    default: 'true'
  fail-on-incomplete:
    description: 'Fail the check when a file could not be fully inspected (archive, oversized file, unsupported binary, missing path). Set to "false" to report only. A file that was not inspected is never counted as clean either way.'
    required: false
    default: 'true'
  upload-sarif:
    description: 'Upload merged SARIF to GitHub code scanning so findings appear inline on the PR. Requires security-events: write.'
    required: false
    default: 'true'
  python-version:
    description: 'Python version used to install the sunglasses package.'
    required: false
    default: '3.x'
  version:
    description: 'sunglasses version spec for pip (e.g. "==0.5.6"). Empty installs the latest published release, so a new release reaches this Action the hour it lands — pin it if you need lockstep.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Sunglasses
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        # The version spec reaches bash as data ($INPUT_VERSION), not as script
        # text, and only the characters a pip version specifier can contain are
        # accepted; anything else is refused with the usage error code (2). The
        # refused value is not echoed, so it cannot smuggle a workflow command.
        if [ -n "$INPUT_VERSION" ]; then
          case "$INPUT_VERSION" in
            *[!A-Za-z0-9.="<>"!~,*+" "-]*)
              echo "::error::version must be a pip version specifier such as ==0.5.6; refusing the given value"
              exit 2 ;;
          esac
          pip install "sunglasses${INPUT_VERSION}"
        else
          pip install sunglasses
        fi
    - name: Scan agent-readable files
      shell: bash
      env:
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_FAIL_ON_THREAT: ${{ inputs.fail-on-threat }}
        INPUT_FAIL_ON_INCOMPLETE: ${{ inputs.fail-on-incomplete }}
      run: bash "${{ github.action_path }}/entrypoint.sh"
    - name: Upload SARIF to code scanning
      if: ${{ always() && inputs.upload-sarif == 'true' && hashFiles('sunglasses.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: sunglasses.sarif
        category: sunglasses
